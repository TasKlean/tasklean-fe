sonar.projectKey=TasKlean_tasklean-fe
sonar.organization=tasklean
sonar.host.url=https://sonarcloud.io

sonar.sources=src
# Tests sit beside the code, so they are both sources and tests to Sonar:
# sonar.exclusions takes them out of the analysed set, test.inclusions adds
# them back as tests. Overlapping without this pair is a scanner error.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Wiring and presentation with no branching logic to unit-test, the same line
# the backend draws around DTOs and config.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,**/*.types.ts,src/app/**/layout.tsx,src/app/**/page.tsx,src/components/marketing/**

# Tailwind 4's `@custom-variant` is invisible to Sonar's CSS parser, so the two
# `&:where(...)` lines in the dark variant read as a nesting selector with no
# scoping root. The variant itself is the scoping root, and the build proves the
# dark palette is emitted twice, once per condition. Sonar already exempts the
# same shape in SCSS `@mixin`, which `@custom-variant` is the Tailwind analogue
# of. Reasoning in PROJECT_BIBLE.md, under the design system.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.e1.resourceKey=src/app/globals.css
