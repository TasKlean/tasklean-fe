name: CI Production

on:
  push:
    branches: [production]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [production]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the two jobs that tag and release ask for more.
permissions:
  contents: read

env:
  IMAGE_NAME: tasklean-web

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  version:
    name: Create Version Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: sonarcloud
    if: github.event_name == 'push'
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  promote:
    name: Promote Staging Image
    runs-on: ubuntu-24.04
    needs: version
    if: github.event_name == 'push'
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      # Full history so the merge commit's parents are readable.
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve the image staging already built
        id: resolve
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Merging main into production makes a new commit, so the image was
          # built for its second parent: the main tip that got merged.
          merged=$(git rev-parse --verify --quiet "HEAD^2" || true)
          for candidate in "$HEAD_SHA" "$merged"; do
            [ -n "$candidate" ] || continue
            tag="$IMAGE:sha-$(printf '%s' "$candidate" | cut -c1-7)"
            echo "Looking for $tag"
            if digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              echo "Promoting $tag ($digest)"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No staging image for $HEAD_SHA or ${merged:-no merge parent}." >&2
          echo "Production promotes what main built, so main must have deployed first." >&2
          exit 1

      # Retags the same manifest: production runs the bytes staging proved,
      # with no rebuild and nothing to drift.
      - name: Tag it as the release
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
          VERSION: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: promote
    environment: Production
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK" > /dev/null

      - name: Wait for deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            sleep 20
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | jq -r '.[0].deploy.status')
            echo "Deploy status: $status"
            if [ "$status" = "live" ]; then echo "Deploy succeeded!"; exit 0; fi
            if [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "deactivated" ]; then
              echo "Deploy failed with status: $status"; exit 1
            fi
          done
          echo "Timed out waiting for deploy (10 min)"; exit 1

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [version, deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          generate_release_notes: true
